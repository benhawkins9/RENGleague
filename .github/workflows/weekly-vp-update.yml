name: Weekly VP Update

# Recomputes Victory Points from the Sleeper API every Tuesday during the NFL
# season (after Monday Night Football finalizes the prior week's scores), commits
# the refreshed data, and pushes — which triggers a Vercel production redeploy.
on:
  schedule:
    # Tuesdays ~8:15am Central, after MNF finalizes the prior week's scores.
    # Two lines because GitHub cron is UTC-only and can't follow DST:
    #   Sep-Oct (CDT, UTC-5): 13:15 UTC = 8:15am
    #   Nov-Dec (CST, UTC-6): 14:15 UTC = 8:15am
    # Last run = Tue Dec 29, 2026 (after NFL Week 17 = league finals).
    # Off the top of the hour on purpose — GitHub queues :00 crons hours late.
    - cron: "15 13 * 9-10 2"
    - cron: "15 14 * 11-12 2"
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: weekly-vp-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Fetch scores + recompute Victory Points
        run: npm run data

      - name: Commit refreshed data (if changed)
        run: |
          git config user.name "RENG League Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          if git diff --staged --quiet; then
            echo "No data changes this week."
          else
            git commit -m "chore: weekly VP update ($(date -u +'%Y-%m-%d'))"
            git push
            echo "Pushed updated VP data — Vercel will redeploy."
          fi
